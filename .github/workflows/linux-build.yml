name: Linux Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The OBS 31/32 runtime tests are validated on Ubuntu 24.04.
          - { obsCompatibility: obs31, os: ubuntu-24.04 }
          - { obsCompatibility: obs32, os: ubuntu-24.04 }
          # OBS 33 requires newer Qt and Linux dependencies.
          - { obsCompatibility: obs33, os: ubuntu-26.04 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            xvfb \
            xauth \
            libgl1-mesa-dri \
            extra-cmake-modules \
            pkg-config \
            zsh \
            qt6-base-dev \
            qt6-svg-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libpulse-dev \
            libasound2-dev \
            libjansson-dev \
            libsimde-dev \
            libdrm-dev \
            libegl-dev \
            libgl-dev \
            libwayland-dev \
            wayland-protocols \
            uthash-dev \
            uuid-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            zlib1g-dev

      - name: Configure
        env:
          TIMELINE_OBS_COMPATIBILITY: ${{ matrix.obsCompatibility }}
        run: .github/scripts/build-ubuntu --target ubuntu-x86_64 --config RelWithDebInfo

      - name: Test under virtual X display
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          TIMELINE_REQUIRE_OBS_RUNTIME: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/.deps/${{ matrix.obsCompatibility }}/lib
        run: xvfb-run -a ctest --test-dir build_x86_64 --output-on-failure --verbose
