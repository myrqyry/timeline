name: Linux Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-svg-dev \
            libobs-dev

      - name: Configure
        run: cmake --preset ubuntu-ci-x86_64

      - name: Build
        run: cmake --build --preset ubuntu-ci-x86_64

      - name: Test
        run: ctest --test-dir build_x86_64 --output-on-failure --verbose
