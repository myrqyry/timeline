name: Shared OBS plugin qualification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@e9eb704437e606721ee92d7d064c4b8168fd8f53
    with:
      module: timeline
      profile: full
      driver: caller
      minimum-tests: 105
      source-package: false
      upload-artifacts: true
