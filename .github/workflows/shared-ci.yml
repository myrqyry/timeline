name: Shared OBS plugin qualification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@238f06a01f1469a21fe6991df7f94ef149472be1
    with:
      module: timeline
      profile: linux
      driver: caller
      minimum-tests: 105
      source-package: false
      upload-artifacts: false
